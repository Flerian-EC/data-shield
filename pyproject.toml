[project]
name = "data-shield-mcp"
version = "0.1.0"
description = "MCP Server for Jupyter Notebooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter-client>=8.10.0",
    "mcp[cli]>=2.1.1",
    "nbformat>=5.11.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
data-shield-mcp = "data_shield_mcp.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_shield_mcp"]

